  hf_video:   {unit: second, usd_per_unit: 0.0, source: "Higgsfield credits; USD per credit to confirm", checked: 2026-10-20}
  hf_lipsync: {unit: second, usd_per_unit: 0.0, source: "Higgsfield credits; USD per credit to confirm", checked: 2026-10-20}
  llm_unpriced:
    unit: call
    usd_per_unit: 0.0
    source: "placeholder: no LLM key/provider chosen yet; price unknown"
    checked: 2026-10-20
  fal_nano_banana_2:
    unit: image
    usd_per_unit: 0.08
    resolution_multipliers: {"0.5K": 0.75, "1K": 1.0, "2K": 1.5, "4K": 2.0}
