# Persona LoRA training (studio train-lora PERSONA). Registry of trained versions: config/loras.yaml
lora:
  trainer:
    model: fal-ai/wan-22-image-trainer
    price_key: fal_wan22_image_trainer
    steps: 1000
    params: {use_face_detection: true, use_masks: true, include_synthetic_captions: false, learning_rate: 0.0007}

# Local quality gate (studio/score.py): identity + visual measured offline; copy/brand/engagement not scored
# until an LLM key exists. Flags never block a stage; they show in status/doctor/review page.
quality:
  enabled: true
  stages: [still, video, lipsync, finish, compose]
  frames: 5                    # frames sampled per video
  identity_threshold: 0.50     # tuned 20 Oct on local data (tools/tune_identity.py): wrong faces max 0.374, Maksim min 0.614
  min_short_side: 1080         # checked on resolution_stages only (model intermediates are 1072x1928)
  resolution_stages: [still, finish, compose]
  min_sharpness: 50            # variance of Laplacian, median over frames
  luma_range: [40, 210]
  max_clipped_pct: 5
