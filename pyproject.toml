[project]
name = "ai-studio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.0.3",
  "pyyaml>=6.0",
  "requests>=2.32",
  "libsql>=0.1.11",
]

[project.optional-dependencies]
score = [
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
]

[tool.vercel]
entrypoint = "app.wsgi:app"
